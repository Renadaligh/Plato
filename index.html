<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050507" />
    <title>Plato — Play. Compete. Connect.</title>
    <link rel="preload" as="image" href="%BASE_URL%art/hero-scene.webp" type="image/webp" />
    <script>
      try {
        var d = document.documentElement;
        var l = localStorage.getItem('plato-lang') || 'en';
        d.lang = l; d.dir = l === 'ar' ? 'rtl' : 'ltr';
      } catch (e) {}
    </script>
    <style>
      html, body { margin: 0; background: #050507; }
      /* Shown instantly (before the JS bundle arrives) so phones never see an empty black screen; removed in main.tsx. */
      #boot { position: fixed; inset: 0; z-index: 100; pointer-events: none; background: #050507 url(%BASE_URL%art/hero-scene.webp) center / cover no-repeat; transition: opacity 1.2s ease; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- non-blocking: the page paints without waiting for Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800;900&family=Ubuntu:wght@500;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'"
    />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800;900&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body>
    <div id="boot" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
