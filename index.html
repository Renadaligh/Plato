<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0e22" />
  <title>Plato بالعربية</title>
  <script>
    try {
      const lang = localStorage.getItem('plato-lang') || 'en';
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      const theme = localStorage.getItem('plato-theme');
      document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
    } catch (_) {}
  </script>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0d0e22; }
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #0d0e22;
      isolation: isolate;
      opacity: 1;
      visibility: visible;
      transition: opacity 850ms cubic-bezier(.22, 1, .36, 1), visibility 850ms;
    }
    #app-loader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .app-loader-glows { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .app-loader-glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .52; animation: loader-drift 22s ease-in-out infinite alternate; }
    .app-loader-glow:nth-child(1) { width: 46vw; height: 46vw; min-width: 360px; min-height: 360px; background: #2f5bff; top: -14vw; inset-inline-start: -8vw; }
    .app-loader-glow:nth-child(2) { width: 42vw; height: 42vw; min-width: 310px; min-height: 310px; background: #7a4dff; top: 10vh; inset-inline-end: -10vw; animation-duration: 28s; }
    .app-loader-glow:nth-child(3) { width: 30vw; height: 30vw; min-width: 250px; min-height: 250px; background: #ff9a5c; bottom: -12vw; inset-inline-end: 20vw; opacity: .3; animation-duration: 25s; }
    @keyframes loader-drift { to { transform: translate(6vw, 4vh) scale(1.12); } }
    .app-loader-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 22px; width: min(240px, 68vw); }
    .app-loader-label { color: #f3f2ff; font-family: Outfit, Poppins, system-ui, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; }
    .app-loader-label::after { display: inline-block; width: 22px; text-align: left; content: ''; animation: loader-dots 1.4s steps(4,end) infinite; }
    @keyframes loader-dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75%,100% { content: '...'; } }
    .app-loader-track { width: 100%; height: 4px; border-radius: 999px; overflow: hidden; background: rgba(255, 255, 255, .18); }
    .app-loader-bar { height: 100%; width: 42%; border-radius: inherit; background: linear-gradient(90deg, #65adff, #94aaff, #c4a7ff); box-shadow: 0 0 15px rgba(115,161,255,.7); animation: loader-sweep 1.6s ease-in-out infinite; }
    @keyframes loader-sweep { 0% { transform: translateX(-120%); } 100% { transform: translateX(340%); } }
    @media (max-width: 600px) {
      #app-loader { background: radial-gradient(ellipse 95% 55% at 45% 24%, #132d83 0%, #111b52 42%, #0a102c 78%, #0b0d21 100%); }
      .app-loader-glow:nth-child(1) { width:115vw; height:115vw; top:-12vw; inset-inline-start:-18vw; background:#277dff; opacity:.56; filter:blur(85px); }
      .app-loader-glow:nth-child(2) { width:95vw; height:95vw; top:28vh; inset-inline-end:-25vw; background:#1555d9; opacity:.25; filter:blur(95px); }
      .app-loader-glow:nth-child(3) { background:#398aff; bottom:-8vw; opacity:.12; }
    }
    @media (prefers-reduced-motion: reduce) {
      .app-loader-glow, .app-loader-bar, .app-loader-label::after { animation: none; }
      .app-loader-bar { transform: none; width: 100%; }
      #app-loader { transition-duration: .15s; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
</head>
<body>
  <div id="app-loader" role="status" aria-label="Loading Plato" aria-live="polite">
    <div class="app-loader-glows" aria-hidden="true"><span class="app-loader-glow"></span><span class="app-loader-glow"></span><span class="app-loader-glow"></span></div>
    <div class="app-loader-content">
      <span class="app-loader-label">Loading</span>
      <div class="app-loader-track" aria-hidden="true"><div class="app-loader-bar"></div></div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
