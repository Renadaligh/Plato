<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0720" />
    <title>Plato — Play. Compete. Connect.</title>
    <link rel="preload" as="image" href="/art/hero-scene.webp" type="image/webp" />
    <script>
      try {
        var d = document.documentElement;
        var t = localStorage.getItem('plato-theme') || 'dark';
        var l = localStorage.getItem('plato-lang') || 'en';
        d.dataset.theme = t; d.lang = l; d.dir = l === 'ar' ? 'rtl' : 'ltr';
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
